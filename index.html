<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const key = "sdks.directory.theme";
          const stored = localStorage.getItem(key);
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.classList.toggle("light", theme === "light");
          document.documentElement.style.colorScheme = theme;
        } catch {}
      })();
    </script>
    <meta
      name="description"
      content="sdks.directory — official SDKs, agent plugins, MCP servers, and skills."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://sdks.directory/" />

    <link rel="alternate" type="text/markdown" href="/" title="Catalog markdown" />
    <link rel="alternate" type="application/json" href="/api" title="API discovery" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
